name: Bug report 🐞
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below so it can be reproduced and fixed quickly.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where are you running Micro REPL?
      options:
        - Android (Google Play)
        - Android (F-Droid)
        - Android (APK from GitHub)
        - Windows
        - macOS
        - Linux
        - Web (browser)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find it in the app's About / Settings screen.
      placeholder: e.g. 4.0.0
    validations:
      required: true

  - type: input
    id: micropython-version
    attributes:
      label: MicroPython version
      description: Optional. Run `import sys; sys.version` in the REPL to get it.
      placeholder: e.g. 1.24.1
    validations:
      required: false

  - type: input
    id: board
    attributes:
      label: Board
      description: Optional. Which board are you using?
      placeholder: e.g. Raspberry Pi Pico W, ESP32-S3
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and the steps to reproduce it. What did you expect to happen?
      placeholder: |
        1. Connect the board
        2. Open the file explorer
        3. ...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots / video
      description: Optional. Drag and drop images or a screen recording here.
    validations:
      required: false
