name: Suggestion 💡
description: Suggest a new feature or an improvement
title: "[Suggestion]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Micro REPL better? Tell us about it!

  - type: textarea
    id: description
    attributes:
      label: Your suggestion
      description: What would you like to see, and why would it be useful?
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots / mockups
      description: Optional. Add images or a video if it helps explain the idea.
    validations:
      required: false
